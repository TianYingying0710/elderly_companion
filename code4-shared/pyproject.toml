[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silver-companion-shared"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/silver_companion_shared"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
